name: 更新音樂會資訊

on:
  schedule:
    # 台灣時間每天 07:00、12:00、19:00（GitHub 用 UTC，且排程可能延遲幾分鐘到半小時）
    - cron: "0 23 * * *"
    - cron: "0 4 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch: # 可在 GitHub 的 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

concurrency:
  group: concerts
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取演出資訊
        run: python scripts/fetch_concerts.py
      - name: 有變動才 commit
        run: |
          git config user.name "concert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concerts/data.json scripts/cache/opentix.json
          if git diff --cached --quiet; then
            echo "沒有新資料"
          else
            git commit -m "自動更新音樂會資訊"
            git push
          fi
